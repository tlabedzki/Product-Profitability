[project]
name = "product-profitability"
version = "1.0.3"
description = "True product-level margin of a fictional online shop after shipping, returns, payment and commission costs"
requires-python = ">=3.11"
license = "MIT"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q -p no:dash"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".cache", "output"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["product_profitability"]
